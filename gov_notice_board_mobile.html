<script>
(function () {
  const STORAGE_KEY = 'govNoticeCardOrder.v1';
  const PALETTE = ['#b7d0ea','#f0d0b0','#e0c8bc','#c5c8e8','#b8ddd6','#c5e0c8','#f0c4c4','#b8dce0','#d4c4e8','#b0c4e0'];
  const ICONS = {
    '보건복지부':'medical_services','행정안전부':'security','외교부':'public','국방부':'security',
    '교육부':'school','고용노동부':'work','문화체육관광부':'theater_comedy','default':'stars'
  };
  const CATEGORY = {
    '재정경제부':'economy','과학기술정보통신부':'economy','산업통상부':'economy','중소벤처기업부':'economy',
    '국토교통부':'economy','농림축산식품부':'economy','해양수산부':'economy','기후에너지환경부':'economy','기획예산처':'economy',
    '교육부':'society','보건복지부':'society','고용노동부':'society','문화체육관광부':'society','성평등가족부':'society','식품의약품안전처':'society',
    '행정안전부':'admin','법무부':'admin','인사혁신처':'admin','법제처':'admin','국가보훈부':'admin',
    '외교부':'diplomacy','통일부':'diplomacy','국방부':'diplomacy'
  };
  const MAJOR_META = {
    '산업통상부': { color:'#b7d0ea', icon:'factory' },
    '기후에너지환경부': { color:'#b8ddd6', icon:'eco' },
    '고용노동부': { color:'#f0d0b0', icon:'groups' },
    '외교부': { color:'#c5c8e8', icon:'public' }
  };
  const MAJOR_ORDER = ['산업통상부','기후에너지환경부','고용노동부','외교부'];
  let currentFilter = 'major';
  let allDepts = [];
  let majorDepts = [];
  let seenMajor = null;
  let seenNotice = null;
  let newOnly = false;
  const NEW_BADGE = '<span class="inline-block mr-1 px-1 py-0.5 rounded text-[10px] font-bold text-white align-middle" style="background:#6b8fb8">신규</span>';

  function postKey(dept, section, title) {
    return dept + '\t' + section + '\t' + String(title || '').trim();
  }
  function keysFromMajor(data) {
    const set = new Set();
    (data.departments || []).forEach(function (d) {
      const name = d.name || '';
      [['공지', d.notices], ['보도', d.press], ['인사', d.hr]].forEach(function (pair) {
        if (!Array.isArray(pair[1])) return;
        pair[1].forEach(function (p) { set.add(postKey(name, pair[0], p.title)); });
      });
    });
    return set;
  }
  function keysFromNotice(data) {
    const set = new Set();
    (data.departments || []).forEach(function (d) {
      (d.posts || []).forEach(function (p) { set.add(postKey(d.name || '', '공지', p.title)); });
    });
    return set;
  }
  function parseJsonEl(id) {
    const el = document.getElementById(id);
    const raw = (el && el.textContent || '').trim();
    if (!raw || raw.charAt(0) !== '{') return null;
    try { return JSON.parse(raw); } catch (e) { return null; }
  }
  function isNewMajor(dept, section, title) {
    return !!(seenMajor && !seenMajor.has(postKey(dept, section, title)));
  }
  function isNewNotice(dept, title) {
    return !!(seenNotice && !seenNotice.has(postKey(dept, '공지', title)));
  }
  function countNewMajor() {
    if (!seenMajor) return 0;
    let n = 0;
    majorDepts.forEach(function (d) {
      [['공지', d.notices], ['보도', d.press], ['인사', d.hr]].forEach(function (pair) {
        if (!Array.isArray(pair[1])) return;
        pair[1].slice(0, 5).forEach(function (p) { if (isNewMajor(d.name, pair[0], p.title)) n++; });
      });
    });
    return n;
  }
  function countNewNotice(depts) {
    if (!seenNotice) return 0;
    let n = 0;
    depts.forEach(function (d) {
      (d.posts || []).slice(0, 5).forEach(function (p) { if (isNewNotice(d.name, p.title)) n++; });
    });
    return n;
  }
  function updateNewBar(count) {
    const bar = document.getElementById('newBar');
    const label = document.getElementById('newCountLabel');
    if (!bar) return;
    bar.classList.remove('hidden');
    if (label) label.textContent = (count || 0) + '건';
  }
  const EMPTY_NEW_MSG = '지금은 새글이 없습니다.';
  function emptyNewBoardHtml() {
    return '<div class="text-center py-16 text-on-surface-variant bg-surface-container-lowest rounded-xl border border-dashed border-outline-variant">' +
      '<p class="font-list-item text-list-item">' + EMPTY_NEW_MSG + '</p></div>';
  }

  function colorFor(name) {
    if (name === '산업통상부') return '#f0d0b0';
    let idx = 0;
    for (let i = 0; i < name.length; i++) idx = (idx + name.charCodeAt(i)) % PALETTE.length;
    return PALETTE[idx];
  }
  function categoryFor(name) { return CATEGORY[name] || 'admin'; }
  function iconFor(name) { return ICONS[name] || ICONS.default; }
  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function applySavedOrder(depts) {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return depts;
      const order = JSON.parse(raw);
      if (!Array.isArray(order) || !order.length) return depts;
      const map = {};
      depts.forEach(d => { map[d.name] = d; });
      const sorted = [];
      order.forEach(name => { if (map[name]) { sorted.push(map[name]); delete map[name]; } });
      Object.keys(map).forEach(k => sorted.push(map[k]));
      return sorted;
    } catch (e) { return depts; }
  }
  function padNum(n) { return (n < 10 ? '0' : '') + n; }
  function itemsHtml(arr, colorClass, dept, section) {
    let list = (arr || []).slice(0, 5);
    if (newOnly) list = list.filter(function (p) { return isNewMajor(dept, section, p.title); });
    if (!list.length) return '<li class="p-2 text-on-surface-variant font-meta-data text-meta-data">항목 없음</li>';
    return list.map(function (p, i) {
      const badge = isNewMajor(dept, section, p.title) ? NEW_BADGE : '';
      return '<li class="py-2 font-list-item text-list-item flex gap-3 items-start">' +
        '<span class="font-bold ' + colorClass + '">' + padNum(i + 1) + '</span>' +
        '<a class="line-clamp-2 text-on-surface no-underline" href="' + esc(p.url || '#') + '" target="_blank" rel="noopener noreferrer">' + badge + esc(p.title) + '</a></li>';
    }).join('');
  }
  function showTab(btn, showId, panelIds) {
    const container = btn.parentElement;
    container.querySelectorAll('button').forEach(function (b) {
      b.classList.remove('border-primary', 'text-primary');
      b.classList.add('border-transparent', 'text-on-surface-variant');
    });
    btn.classList.add('border-primary', 'text-primary');
    btn.classList.remove('border-transparent', 'text-on-surface-variant');
    panelIds.forEach(function (id) {
      const el = document.getElementById(id);
      if (!el) return;
      if (id === showId) { el.classList.remove('hidden'); el.classList.add('block'); }
      else { el.classList.add('hidden'); el.classList.remove('block'); }
    });
  }
  window.showTab = showTab;
  function renderMajorTogether() {
    const board = document.getElementById('board');
    board.className = 'mb-20 px-4 flex flex-col gap-5 max-w-lg mx-auto w-full';
    if (newOnly && countNewMajor() === 0) {
      board.innerHTML = emptyNewBoardHtml();
      return;
    }
    const map = {};
    majorDepts.forEach(function (d) { map[d.name] = d; });
    const depts = MAJOR_ORDER.map(function (n) { return map[n] || { name: n, notices: [], press: [], hr: [] }; });
    board.innerHTML = depts.map(function (d, idx) {
      const m = MAJOR_META[d.name] || { color: '#b7d0ea', icon: 'star' };
      const noticeLabel = d.noticeLabel || '공지사항';
      const pressLabel = d.pressLabel || '보도자료';
      const hrLabel = d.hrLabel || '인사동정';
      const hasHr = Array.isArray(d.hr);
      const nid = 'notice-' + idx;
      const pid = 'press-' + idx;
      const hid = 'hr-' + idx;
      const panels = hasHr ? ("['" + nid + "','" + pid + "','" + hid + "']") : ("['" + nid + "','" + pid + "']");
      let tabs = '<button type="button" class="flex-1 py-3 px-1 font-button-text text-button-text border-b-2 border-primary text-primary" onclick="showTab(this,\'' + nid + '\',' + panels + ')">' + esc(noticeLabel) + '</button>' +
        '<button type="button" class="flex-1 py-3 px-1 font-button-text text-button-text border-b-2 border-transparent text-on-surface-variant" onclick="showTab(this,\'' + pid + '\',' + panels + ')">' + esc(pressLabel) + '</button>';
      if (hasHr) {
        tabs += '<button type="button" class="flex-1 py-3 px-1 font-button-text text-button-text border-b-2 border-transparent text-on-surface-variant" onclick="showTab(this,\'' + hid + '\',' + panels + ')">' + esc(hrLabel) + '</button>';
      }
      let panelsHtml = '<ul class="divide-y divide-primary/10 p-2 block" id="' + nid + '">' + itemsHtml(d.notices, 'text-primary', d.name, '공지') + '</ul>' +
        '<ul class="divide-y divide-primary/10 p-2 hidden" id="' + pid + '">' + itemsHtml(d.press, 'text-secondary', d.name, '보도') + '</ul>';
      if (hasHr) {
        panelsHtml += '<ul class="divide-y divide-primary/10 p-2 hidden" id="' + hid + '">' + itemsHtml(d.hr, 'text-tertiary', d.name, '인사') + '</ul>';
      }
      return '<article class="bg-surface-container-lowest rounded-xl overflow-hidden border border-outline-variant/30">' +
        '<header class="px-4 py-3 flex justify-between items-center" style="background:' + m.color + '">' +
        '<h2 class="font-board-title text-board-title" style="color:#3d4a5c">' + esc(d.name) + '</h2>' +
        '<span class="material-symbols-outlined" style="color:#5a6472">' + m.icon + '</span></header>' +
        '<div class="p-0"><div class="flex border-b border-outline-variant">' + tabs + '</div>' + panelsHtml + '</div></article>';
    }).join('');
  }
  function render() {
    const board = document.getElementById('board');
    if (currentFilter === 'major') {
      updateNewBar(countNewMajor());
      renderMajorTogether();
      return;
    }
    board.className = 'mb-20 px-4 flex flex-col gap-5 max-w-lg mx-auto w-full';
    let depts = allDepts.slice();
    if (currentFilter !== 'all') {
      depts = depts.filter(d => categoryFor(d.name) === currentFilter);
      depts = applySavedOrder(depts);
    } else {
      depts = applySavedOrder(depts);
    }
    updateNewBar(countNewNotice(depts));
    if (newOnly) {
      depts = depts.filter(function (d) {
        return (d.posts || []).some(function (p) { return isNewNotice(d.name, p.title); });
      });
    }
    if (!depts.length) {
      board.innerHTML = newOnly
        ? emptyNewBoardHtml()
        : '<div class="text-center py-16 text-on-surface-variant bg-surface-container-lowest rounded-xl border border-dashed border-outline-variant">표시할 공지 데이터가 없습니다.</div>';
      return;
    }
    board.innerHTML = depts.map(function (d) {
      const head = colorFor(d.name);
      const icon = iconFor(d.name);
      if (d.ok === false || !d.posts || !d.posts.length) {
        return '<article class="notice-card bg-surface-container-lowest rounded-xl overflow-hidden border border-outline-variant/30">' +
          '<header class="px-4 py-3 flex justify-between items-center" style="background:' + head + '">' +
          '<h2 class="font-board-title text-board-title" style="color:#3d4a5c">' + esc(d.name) + '</h2>' +
          '<span class="material-symbols-outlined" style="color:#5a6472">' + icon + '</span></header>' +
          '<div class="p-card-padding text-error font-bold text-sm">설정 페이지를 수정하세요.</div></article>';
      }
      const items = d.posts.slice(0, 5).filter(function (p) {
        return !newOnly || isNewNotice(d.name, p.title);
      }).map(function (p, i, arr) {
        const last = i === arr.length - 1;
        const border = last ? '' : ' border-b border-outline-variant/20 pb-2';
        const badge = isNewNotice(d.name, p.title) ? NEW_BADGE : '';
        return '<li class="flex items-start gap-3">' +
          '<span class="font-meta-data text-meta-data pt-1" style="color:#6b8fb8">' + padNum(i + 1) + '</span>' +
          '<div class="flex flex-col w-full' + border + '">' +
          '<a class="font-list-item text-list-item text-on-surface line-clamp-2 no-underline" href="' + esc(p.url) + '" target="_blank" rel="noopener noreferrer">' + badge + esc(p.title) + '</a>' +
          '</div></li>';
      }).join('');
      return '<article class="notice-card bg-surface-container-lowest rounded-xl overflow-hidden border border-outline-variant/30 transition-transform active:scale-[0.98]" data-name="' + esc(d.name) + '">' +
        '<header class="px-4 py-3 flex justify-between items-center" style="background:' + head + '">' +
        '<h2 class="font-board-title text-board-title" style="color:#3d4a5c">' + esc(d.name) + '</h2>' +
        '<span class="material-symbols-outlined" style="color:#5a6472">' + icon + '</span></header>' +
        '<div class="p-card-padding"><ul class="space-y-4">' + items + '</ul></div></article>';
    }).join('');
  }
  function setFilter(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.tab-btn').forEach(b => {
      b.classList.remove('tab-active', 'bg-secondary-container', 'text-on-secondary-container');
      b.classList.add('text-on-surface-variant', 'hover:bg-surface-variant');
    });
    if (btn) {
      btn.classList.add('tab-active');
      btn.classList.remove('text-on-surface-variant', 'hover:bg-surface-variant');
      btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }
    render();
  }
  function load() {
    const raw = document.getElementById('notice-data').textContent.trim();
    let data = { collectedAt: '', departments: [] };
    try { if (raw && raw.charAt(0) === '{') data = JSON.parse(raw); } catch (e) { console.error(e); }
    allDepts = Array.isArray(data.departments) ? data.departments.slice() : [];
    const majorRaw = (document.getElementById('major-data') || {}).textContent || '';
    try {
      const trimmed = String(majorRaw).trim();
      if (trimmed && trimmed.charAt(0) === '{') {
        const major = JSON.parse(trimmed);
        majorDepts = Array.isArray(major.departments) ? major.departments.slice() : [];
      }
    } catch (e) { majorDepts = []; }
    const prevNotice = parseJsonEl('notice-prev-data');
    const prevMajor = parseJsonEl('major-prev-data');
    seenNotice = prevNotice && Array.isArray(prevNotice.departments) && prevNotice.departments.length ? keysFromNotice(prevNotice) : null;
    seenMajor = prevMajor && Array.isArray(prevMajor.departments) && prevMajor.departments.length ? keysFromMajor(prevMajor) : null;
    document.getElementById('metaTime').textContent = allDepts.length + '개부처 수집시각 : ' + (data.collectedAt || '-');
    document.getElementById('metaCount').textContent = '';
    render();
  }
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', function () { setFilter(btn.getAttribute('data-filter'), btn); });
  });
  document.getElementById('btnReload').addEventListener('click', function () { location.reload(); });
  document.getElementById('fabSync').addEventListener('click', function () {
    const icon = this.querySelector('.material-symbols-outlined');
    icon.classList.add('animate-spin');
    setTimeout(function () {
      icon.classList.remove('animate-spin');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      location.reload();
    }, 800);
  });
  document.getElementById('newOnly').addEventListener('change', function () {
    newOnly = this.checked;
    render();
  });
  load();
})();
</script>
</body>
</html>
