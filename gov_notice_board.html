<script>
(function () {
  const STORAGE_KEY = 'govNoticeCardOrder.v1';
  const PALETTE = ['#b7d0ea','#c5c8e8','#b8ddd6','#f0d0b0','#d4c4e8','#c5e0c8','#f0c4c4','#b8dce0','#c8e0d4','#b0c4e0'];
  const CATEGORY = {
    '재정경제부':'economy','과학기술정보통신부':'economy','산업통상부':'economy','중소벤처기업부':'economy',
    '국토교통부':'economy','농림축산식품부':'economy','해양수산부':'economy','기후에너지환경부':'economy','기획예산처':'economy',
    '교육부':'society','보건복지부':'society','고용노동부':'society','문화체육관광부':'society','성평등가족부':'society','식품의약품안전처':'society',
    '행정안전부':'admin','법무부':'admin','인사혁신처':'admin','법제처':'admin','국가보훈부':'admin',
    '외교부':'diplomacy','통일부':'diplomacy','국방부':'diplomacy'
  };
  const MAJOR_META = {
    '산업통상부': { color:'#b7d0ea', icon:'factory', domain:'MOTIR.GO.KR' },
    '기후에너지환경부': { color:'#b8ddd6', icon:'eco', domain:'MCEE.GO.KR' },
    '고용노동부': { color:'#f0d0b0', icon:'groups', domain:'MOEL.GO.KR' },
    '외교부': { color:'#c5c8e8', icon:'public', domain:'MOFA.GO.KR' }
  };
  const MAJOR_ORDER = ['산업통상부','기후에너지환경부','고용노동부','외교부'];
  let dragSrc = null;
  let currentFilter = 'major';
  let allDepts = [];
  let majorDepts = [];
  let seenMajor = null;
  let seenNotice = null;
  let newOnly = false;
  const NEW_BADGE = '<span class="inline-block mr-1 px-1.5 py-0.5 rounded text-[11px] font-bold text-white align-middle" style="background:#6b8fb8">신규</span>';

  function postKey(dept, section, title) {
    return dept + '\t' + section + '\t' + String(title || '').trim();
  }
  function keysFromMajor(data) {
    const set = new Set();
    (data.departments || []).forEach(function (d) {
      const name = d.name || '';
      [['공지', d.notices], ['보도', d.press], ['인사', d.hr]].forEach(function (pair) {
        if (!Array.isArray(pair[1])) return;
        pair[1].forEach(function (p) { set.add(postKey(name, pair[0], p.title)); });
      });
    });
    return set;
  }
  function keysFromNotice(data) {
    const set = new Set();
    (data.departments || []).forEach(function (d) {
      (d.posts || []).forEach(function (p) { set.add(postKey(d.name || '', '공지', p.title)); });
    });
    return set;
  }
  function parseJsonEl(id) {
    const el = document.getElementById(id);
    const raw = (el && el.textContent || '').trim();
    if (!raw || raw.charAt(0) !== '{') return null;
    try { return JSON.parse(raw); } catch (e) { return null; }
  }
  function isNewMajor(dept, section, title) {
    return !!(seenMajor && !seenMajor.has(postKey(dept, section, title)));
  }
  function isNewNotice(dept, title) {
    return !!(seenNotice && !seenNotice.has(postKey(dept, '공지', title)));
  }
  function countNewMajor() {
    if (!seenMajor) return 0;
    let n = 0;
    majorDepts.forEach(function (d) {
      [['공지', d.notices], ['보도', d.press], ['인사', d.hr]].forEach(function (pair) {
        if (!Array.isArray(pair[1])) return;
        pair[1].slice(0, 5).forEach(function (p) { if (isNewMajor(d.name, pair[0], p.title)) n++; });
      });
    });
    return n;
  }
  function countNewNotice(depts) {
    if (!seenNotice) return 0;
    let n = 0;
    depts.forEach(function (d) {
      (d.posts || []).slice(0, 5).forEach(function (p) { if (isNewNotice(d.name, p.title)) n++; });
    });
    return n;
  }
  function updateNewBar(count) {
    const bar = document.getElementById('newBar');
    const label = document.getElementById('newCountLabel');
    if (!bar) return;
    bar.classList.remove('hidden');
    if (label) label.textContent = '신규 ' + (count || 0) + '건';
  }
  const EMPTY_NEW_MSG = '지금은 새글이 없습니다.';
  function emptyNewBoardHtml(extraClass) {
    return '<div class="' + (extraClass || '') + ' text-center py-16 text-on-surface-variant bg-surface-container rounded-xl border border-dashed border-outline-variant">' +
      '<p class="font-list-item text-list-item">' + EMPTY_NEW_MSG + '</p></div>';
  }

  function colorFor(name) {
    if (name === '산업통상부') return '#f0d0b0';
    let idx = 0;
    for (let i = 0; i < name.length; i++) idx = (idx + name.charCodeAt(i)) % PALETTE.length;
    return PALETTE[idx];
  }
  function categoryFor(name) { return CATEGORY[name] || 'admin'; }
  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function saveOrder() {
    const names = Array.from(document.querySelectorAll('#board .board-card')).map(c => c.getAttribute('data-name'));
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(names)); } catch (e) {}
  }
  function applySavedOrder(depts) {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return depts;
      const order = JSON.parse(raw);
      if (!Array.isArray(order) || !order.length) return depts;
      const map = {};
      depts.forEach(d => { map[d.name] = d; });
      const sorted = [];
      order.forEach(name => { if (map[name]) { sorted.push(map[name]); delete map[name]; } });
      Object.keys(map).forEach(k => sorted.push(map[k]));
      return sorted;
    } catch (e) { return depts; }
  }
  function bindDrag(card) {
    card.setAttribute('draggable', 'true');
    card.addEventListener('dragstart', function (e) {
      if (e.target && e.target.closest && e.target.closest('a')) { e.preventDefault(); return; }
      dragSrc = card;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', card.getAttribute('data-name') || ''); } catch (err) {}
    });
    card.addEventListener('dragend', function () {
      card.classList.remove('dragging');
      document.querySelectorAll('.board-card.drag-over').forEach(el => el.classList.remove('drag-over'));
      dragSrc = null;
      saveOrder();
    });
    card.addEventListener('dragover', function (e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      if (dragSrc && dragSrc !== card) card.classList.add('drag-over');
    });
    card.addEventListener('dragleave', function () { card.classList.remove('drag-over'); });
    card.addEventListener('drop', function (e) {
      e.preventDefault();
      card.classList.remove('drag-over');
      if (!dragSrc || dragSrc === card) return;
      const board = document.getElementById('board');
      const cards = Array.from(board.children);
      const from = cards.indexOf(dragSrc);
      const to = cards.indexOf(card);
      if (from < 0 || to < 0) return;
      if (from < to) board.insertBefore(dragSrc, card.nextSibling);
      else board.insertBefore(dragSrc, card);
      saveOrder();
    });
  }
  function listHtml(items, isPress, dept, section) {
    let arr = (items || []).slice(0, 5);
    if (newOnly) arr = arr.filter(function (p) { return isNewMajor(dept, section, p.title); });
    if (!arr.length) return '<li class="py-3 text-on-surface-variant font-meta-data text-meta-data">표시할 항목이 없습니다.</li>';
    return arr.map(function (p, i) {
      const last = i === arr.length - 1;
      const border = last ? '' : (isPress ? ' border-b border-secondary/10' : ' border-b border-outline-variant/10');
      const date = p.date ? '<span class="font-meta-data text-meta-data text-on-surface-variant whitespace-nowrap">' + esc(p.date) + '</span>' : '';
      const badge = isNewMajor(dept, section, p.title) ? NEW_BADGE : '';
      return '<li class="flex justify-between items-start gap-4 py-2' + border + '">' +
        '<a class="font-list-item text-list-item text-on-surface line-clamp-1 hover:opacity-80 no-underline" style="color:inherit" href="' + esc(p.url || '#') + '" target="_blank" rel="noopener noreferrer" draggable="false">' + badge + esc(p.title) + '</a>' + date + '</li>';
    }).join('');
  }
  function sectionHtml(title, icon, colorStyle, items, isPress, extraClass, dept, section) {
    return '<div class="p-6' + (extraClass || '') + '"><h4 class="flex items-center gap-2 mb-4 font-button-text text-button-text" style="' + colorStyle + '">' +
      '<span class="material-symbols-outlined text-[18px]">' + icon + '</span>' + esc(title) + '</h4>' +
      '<ul class="space-y-1">' + listHtml(items, isPress, dept, section) + '</ul></div>';
  }
  function renderMajorTogether() {
    const board = document.getElementById('board');
    board.className = 'flex flex-col gap-8';
    if (newOnly && countNewMajor() === 0) {
      board.innerHTML = emptyNewBoardHtml();
      return;
    }
    const map = {};
    majorDepts.forEach(function (d) { map[d.name] = d; });
    const depts = MAJOR_ORDER.map(function (n) { return map[n] || { name: n, notices: [], press: [], hr: [] }; });
    board.innerHTML = depts.map(function (d) {
      const m = MAJOR_META[d.name] || { color: '#b7d0ea', icon: 'star', domain: '' };
      const noticeLabel = d.noticeLabel || '공지사항';
      const pressLabel = d.pressLabel || '보도자료';
      const hrLabel = d.hrLabel || '인사동정';
      const hasHr = Array.isArray(d.hr);
      const cols = hasHr ? 'md:grid-cols-3' : 'md:grid-cols-2';
      let body = sectionHtml(noticeLabel, 'notifications', 'color:#6b8fb8', d.notices, false, '', d.name, '공지');
      body += sectionHtml(pressLabel, 'newspaper', 'color:#c9956e', d.press, true, ' bg-surface-container-lowest/50', d.name, '보도');
      if (hasHr) body += sectionHtml(hrLabel, 'badge', 'color:#b08978', d.hr, false, '', d.name, '인사');
      return '<article class="bg-white rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.05)] overflow-hidden border border-outline-variant/30 flex flex-col">' +
        '<div class="px-6 py-4 flex justify-between items-center" style="background:' + m.color + '">' +
        '<div class="flex items-center gap-3"><span class="material-symbols-outlined" style="color:#3d4a5c">' + m.icon + '</span>' +
        '<h3 class="font-board-title text-board-title" style="color:#3d4a5c">' + esc(d.name) + '</h3></div>' +
        '<span class="font-meta-data text-meta-data" style="color:#5a6472">' + esc(m.domain) + '</span></div>' +
        '<div class="grid grid-cols-1 ' + cols + ' divide-x divide-outline-variant/20">' + body + '</div></article>';
    }).join('');
  }
  function render() {
    const board = document.getElementById('board');
    if (currentFilter === 'major') {
      updateNewBar(countNewMajor());
      renderMajorTogether();
      return;
    }
    board.className = 'grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-grid-gutter';
    let depts = allDepts.slice();
    if (currentFilter !== 'all') {
      depts = depts.filter(d => categoryFor(d.name) === currentFilter);
      depts = applySavedOrder(depts);
    } else {
      depts = applySavedOrder(depts);
    }
    updateNewBar(countNewNotice(depts));
    if (newOnly) {
      depts = depts.filter(function (d) {
        return (d.posts || []).some(function (p) { return isNewNotice(d.name, p.title); });
      });
    }
    if (!depts.length) {
      board.innerHTML = newOnly
        ? emptyNewBoardHtml('col-span-full')
        : '<div class="col-span-full text-center py-16 text-on-surface-variant bg-surface-container rounded-xl border border-dashed border-outline-variant">표시할 공지 데이터가 없습니다.</div>';
      return;
    }
    board.innerHTML = depts.map(function (d) {
      const head = colorFor(d.name);
      const cat = categoryFor(d.name);
      if (d.ok === false || !d.posts || !d.posts.length) {
        return '<article class="board-card bg-surface-container-lowest rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.05)] border border-outline-variant flex flex-col h-full overflow-hidden" data-name="' + esc(d.name) + '" data-category="' + cat + '">' +
          '<header class="p-4 flex justify-between items-center" style="background:' + head + '"><h3 class="font-board-title text-board-title" style="color:#3d4a5c">[' + esc(d.name) + ']</h3><span class="material-symbols-outlined text-sm" style="color:#5a6472">more_vert</span></header>' +
          '<div class="p-4 text-error font-bold text-sm bg-error-container">설정 페이지를 수정하세요.</div></article>';
      }
      const items = d.posts.slice(0, 5).filter(function (p) {
        return !newOnly || isNewNotice(d.name, p.title);
      }).map(function (p, i, arr) {
        const border = i < arr.length - 1 ? ' border-b border-outline-variant/30' : '';
        const badge = isNewNotice(d.name, p.title) ? NEW_BADGE : '';
        return '<li class="py-3' + border + ' flex gap-3 hover:bg-surface-container-low transition-colors px-2 rounded-md">' +
          '<span class="font-bold text-sm" style="color:#6b8fb8">' + (i + 1) + '.</span>' +
          '<a class="text-on-surface-variant font-list-item text-list-item truncate" href="' + esc(p.url) + '" target="_blank" rel="noopener noreferrer" draggable="false" title="' + esc(p.title) + '">' + badge + esc(p.title) + '</a></li>';
      }).join('');
      return '<article class="board-card bg-surface-container-lowest rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.05)] border border-outline-variant flex flex-col h-full overflow-hidden" data-name="' + esc(d.name) + '" data-category="' + cat + '">' +
        '<header class="p-4 flex justify-between items-center" style="background:' + head + '"><h3 class="font-board-title text-board-title" style="color:#3d4a5c">[' + esc(d.name) + ']</h3><span class="material-symbols-outlined text-sm" style="color:#5a6472">more_vert</span></header>' +
        '<div class="p-4 flex flex-col gap-0"><ul class="space-y-0">' + items + '</ul></div></article>';
    }).join('');
    Array.from(board.querySelectorAll('.board-card')).forEach(bindDrag);
  }
  function setFilter(filter) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(btn => {
      const active = btn.getAttribute('data-filter') === filter;
      btn.classList.toggle('filter-active', active);
      btn.classList.toggle('text-on-surface-variant', !active);
    });
    render();
  }
  function load() {
    const raw = document.getElementById('notice-data').textContent.trim();
    let data = { collectedAt: '', departments: [] };
    try { if (raw && raw.charAt(0) === '{') data = JSON.parse(raw); } catch (e) { console.error(e); }
    allDepts = Array.isArray(data.departments) ? data.departments.slice() : [];
    const majorRaw = (document.getElementById('major-data') || {}).textContent || '';
    try {
      const trimmed = String(majorRaw).trim();
      if (trimmed && trimmed.charAt(0) === '{') {
        const major = JSON.parse(trimmed);
        majorDepts = Array.isArray(major.departments) ? major.departments.slice() : [];
      }
    } catch (e) { majorDepts = []; }
    const prevNotice = parseJsonEl('notice-prev-data');
    const prevMajor = parseJsonEl('major-prev-data');
    seenNotice = prevNotice && Array.isArray(prevNotice.departments) && prevNotice.departments.length ? keysFromNotice(prevNotice) : null;
    seenMajor = prevMajor && Array.isArray(prevMajor.departments) && prevMajor.departments.length ? keysFromMajor(prevMajor) : null;
    document.getElementById('metaLine').innerHTML =
      '<span class="font-bold">' + allDepts.length + '개부처</span> 수집시각 : <span class="font-bold">' + esc(data.collectedAt || '-') + '</span>';
    render();
  }
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', function () { setFilter(btn.getAttribute('data-filter')); });
  });
  document.getElementById('btnReload').addEventListener('click', function () { location.reload(); });
  document.getElementById('newOnly').addEventListener('change', function () {
    newOnly = this.checked;
    render();
  });
  load();
})();
</script>
</body>
</html>
