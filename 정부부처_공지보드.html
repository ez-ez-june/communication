  <style>
    :root {
      --ink: #1f2a37;
      --muted: #5b6775;
      --line: #d9e2ec;
      --bg0: #eef3f8;
      --bg1: #f7fafc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
      background:
        radial-gradient(1200px 500px at 10% -10%, #dbe7f5 0%, transparent 55%),
        radial-gradient(900px 420px at 100% 0%, #e4eef8 0%, transparent 50%),
        linear-gradient(180deg, var(--bg1), var(--bg0));
    }
    .wrap {
      width: min(1480px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 48px;
    }
    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 22px;
      border-radius: 14px;
      background: linear-gradient(135deg, #1f4e79 0%, #2f6ea8 100%);
      color: #fff;
      box-shadow: 0 10px 28px rgba(31, 78, 121, 0.28);
      margin-bottom: 14px;
    }
    .topbar h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .topbar p {
      margin: 6px 0 0;
      font-size: 0.86rem;
      opacity: 0.9;
    }
    .btn-refresh {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 11px 18px;
      background: #276ef1;
      color: #fff;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(39, 110, 241, 0.35);
      white-space: nowrap;
    }
    .btn-refresh:hover { filter: brightness(1.06); }
    .meta {
      margin: 0 0 18px;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.84rem;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 4px 14px rgba(31, 42, 55, 0.06);
      min-height: 188px;
      display: flex;
      flex-direction: column;
    }
    .card-head {
      padding: 9px 12px;
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
    }
    .card-body { flex: 1; padding: 4px 0; }
    .item {
      display: grid;
      grid-template-columns: 28px 1fr;
      align-items: center;
      min-height: 28px;
      border-top: 1px solid rgba(0, 0, 0, 0.06);
      padding: 0 8px 0 4px;
    }
    .item:first-child { border-top: 0; }
    .num {
      text-align: center;
      font-weight: 700;
      font-size: 0.82rem;
      color: #334155;
    }
    .title {
      display: block;
      font-size: 0.82rem;
      line-height: 1.35;
      color: #0563c1;
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .title:hover { text-decoration: underline; }
    .fail {
      padding: 14px 12px;
      color: #c00000;
      font-weight: 700;
      font-size: 0.86rem;
      background: #fce4d6;
    }
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 16px;
      color: var(--muted);
      background: rgba(255,255,255,0.7);
      border: 1px dashed var(--line);
      border-radius: 12px;
    }
    @media (max-width: 1200px) {
      .board { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 860px) {
      .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .topbar { flex-direction: column; align-items: flex-start; }
    }
    @media (max-width: 560px) {
      .board { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <script>
    const PALETTE = [
      { head: '#3a7bd5', body: '#eff6ff', border: '#265aaa' },
      { head: '#667eea', body: '#f3f0ff', border: '#4c60be' },
      { head: '#009688', body: '#e8f5e9', border: '#00796b' },
      { head: '#ff7043', body: '#fff3e0', border: '#e65100' },
      { head: '#7e57c2', body: '#f5f0ff', border: '#5e35b1' },
      { head: '#2e7d32', body: '#edf7ed', border: '#1b5e20' },
      { head: '#c62828', body: '#ffebee', border: '#b71c1c' },
      { head: '#0079bf', body: '#ecf8ff', border: '#005a8c' }
    ];
    const MOTIR = { head: '#ff8c00', body: '#fff3e0', border: '#e66e00' };

    function colorFor(name) {
      if (name === '산업통상부') return MOTIR;
      let idx = 0;
      for (let i = 0; i < name.length; i++) idx = (idx + name.charCodeAt(i)) % 8;
      return PALETTE[idx];
    }

    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function render(data) {
      const board = document.getElementById('board');
      const meta = document.getElementById('metaLine');
      const collected = data.collectedAt || '-';
      const depts = Array.isArray(data.departments) ? data.departments : [];
      meta.textContent =
        '수집시각: ' + collected + '  |  부처 ' + depts.length + '개  |  카드 4단  |  제목 클릭 시 새 창';

      if (!depts.length) {
        board.innerHTML = '<div class="empty">표시할 공지 데이터가 없습니다.</div>';
        return;
      }

      board.innerHTML = depts.map(function (d) {
        const c = colorFor(d.name);
        const head = '[' + esc(d.name) + ']';
        if (d.ok === false || !d.posts || !d.posts.length) {
          return '<article class="card" style="border-color:' + c.border + '">' +
            '<div class="card-head" style="background:' + c.head + '">' + head + '</div>' +
            '<div class="fail">설정 페이지를 수정하세요.</div></article>';
        }
        const items = d.posts.slice(0, 5).map(function (p, i) {
          return '<div class="item" style="background:' + c.body + '">' +
            '<div class="num">' + (i + 1) + '.</div>' +
            '<a class="title" href="' + esc(p.url) + '" target="_blank" rel="noopener noreferrer" title="' + esc(p.title) + '">' +
            esc(p.title) + '</a></div>';
        }).join('');
        return '<article class="card" style="border-color:' + c.border + '">' +
          '<div class="card-head" style="background:' + c.head + '">' + head + '</div>' +
          '<div class="card-body">' + items + '</div></article>';
      }).join('');
    }

    function load() {
      const raw = document.getElementById('notice-data').textContent.trim();
      let data = { collectedAt: '', departments: [] };
      try {
        if (raw && raw.charAt(0) === '{') data = JSON.parse(raw);
      } catch (e) {
        console.error(e);
      }
      render(data);
    }

    document.getElementById('btnReload').addEventListener('click', function () {
      location.reload();
    });
    load();
  </script>
